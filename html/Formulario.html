<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro / Inicio - AppApuestas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Segoe UI, Roboto, Arial, sans-serif;background:#f5f7fa;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.08);width:380px}
    h1{margin:0 0 12px;font-size:20px}
    label{display:block;margin-top:10px;font-size:13px}
    input{width:100%;padding:10px;margin-top:6px;border:1px solid #d1d9e6;border-radius:6px;box-sizing:border-box}
    .row{display:flex;gap:8px;align-items:center}
    .error{color:#b00020;font-size:13px;margin-top:8px;display:none}
    .success{color:green;font-size:14px;margin-top:8px;display:none}
    button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:6px;background:#0a74da;color:#fff;font-weight:700;cursor:pointer}
    .toggle{background:#eef;padding:6px;border-radius:6px;border:1px solid #cde;cursor:pointer}
    .small{font-size:13px;color:#6b7280;margin-top:8px}
  </style>

  <!-- reCAPTCHA v2 (checkbox). Reemplaza TU_SITE_KEY_V2 por tu clave pública v2 -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <div class="card" role="main" aria-labelledby="h-login">
    <h1 id="h-login">Crear cuenta</h1>

    <form id="loginForm" novalidate>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required minlength="3" placeholder="Tu nombre">
      <div id="nombreError" class="error">Introduce un nombre válido (mín. 3 caracteres).</div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="usuario@ejemplo.com">
      <div id="emailError" class="error">Introduce un correo válido.</div>

      <label for="password">Contraseña</label>
      <div class="row">
        <input id="password" name="password" type="password" required minlength="8" placeholder="Mín. 8 caracteres">
        <button type="button" id="togglePwd" class="toggle" aria-pressed="false">Mostrar</button>
      </div>
      <div id="pwdError" class="error">La contraseña debe tener al menos 8 caracteres.</div>

      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" placeholder="Repite la contraseña">
      <div id="confirmError" class="error">Las contraseñas no coinciden.</div>

      <!-- reCAPTCHA v2 widget (clave de prueba para desarrollo) -->
      <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" id="recaptchaWidget"></div>
      <div id="recaptchaError" class="error">Confirma que no eres un robot.</div>

      <button type="submit" id="submitBtn">Registrarse</button>
      <div id="success" class="success">Registro validado. Enviando al servidor...</div>
      <div id="serverError" class="error" style="display:none"></div>

      <div class="small">¿Ya tienes cuenta? <a href="Inicio.html">Inicio</a></div>
    </form>
  </div>

  <script src="../java/Formulario.js"></script>
</body>
</html>
