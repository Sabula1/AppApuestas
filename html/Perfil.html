<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .balance-card {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .balance-card:hover {
            transform: scale(1.02);
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <img src="default-avatar.jpg" alt="Foto de perfil" class="profile-pic">
            <div>
                <h2>Bienvenido, Usuario</h2>
                <a href="configuracion.html" class="btn btn-secondary">
                    <i class="fas fa-cog"></i> Configuración
                </a>
            </div>
        </div>

        <div class="card balance-card" onclick="window.location.href='recargar.html'">
            <div class="card-body text-center">
                <h3>Saldo Actual</h3>
                <h2 class="text-success">$0.00</h2>
                <small>Click para recargar</small>
            </div>
        </div>

        <div class="stats-container">
            <div class="card">
                <div class="card-body text-center">
                    <h5>Apuestas Totales</h5>
                    <h3>0</h3>
                </div>
            </div>
            <div class="card">
                <div class="card-body text-center">
                    <h5>Apuestas Ganadas</h5>
                    <h3 class="text-success">0</h3>
                </div>
            </div>
            <div class="card">
                <div class="card-body text-center">
                    <h5>Apuestas Perdidas</h5>
                    <h3 class="text-danger">0</h3>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="apostar.html" class="btn btn-primary btn-lg">
                JUGAR
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</body>
</html>
